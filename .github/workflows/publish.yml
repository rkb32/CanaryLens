name: Verify and publish CanaryLens

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: controller/go.mod
      - name: Test Go controller
        working-directory: controller
        run: go test ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test gRPC scorer
        run: |
          python -m pip install -r scorer/requirements.txt -r requirements-dev.txt
          python -m unittest discover -s scorer -v
          python scripts/validate_yaml.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build
      - uses: docker/setup-buildx-action@v3
      - name: Build controller image
        uses: docker/build-push-action@v6
        with:
          context: ./controller
          push: false
      - name: Build scorer image
        uses: docker/build-push-action@v6
        with:
          context: ./scorer
          push: false
      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          push: false

  integration:
    needs: [verify]
    runs-on: ubuntu-latest
    env:
      CHECK_INTERVAL: 1s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start local stack
        run: docker compose up --build --detach
      - name: Exercise 25 rollback scenarios
        run: python scripts/smoke_demo.py
      - name: Collect stack logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    if: github.event_name == 'push'
    needs: [verify, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: controller-meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/canarylens-controller
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ./controller
          push: true
          tags: ${{ steps.controller-meta.outputs.tags }}
          labels: ${{ steps.controller-meta.outputs.labels }}
      - uses: docker/metadata-action@v5
        id: scorer-meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/canarylens-scorer
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ./scorer
          push: true
          tags: ${{ steps.scorer-meta.outputs.tags }}
          labels: ${{ steps.scorer-meta.outputs.labels }}
      - uses: docker/metadata-action@v5
        id: dashboard-meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/canarylens-dashboard
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          push: true
          tags: ${{ steps.dashboard-meta.outputs.tags }}
          labels: ${{ steps.dashboard-meta.outputs.labels }}
