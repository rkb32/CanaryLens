apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: canaryrollouts.canarylens.io
spec:
  group: canarylens.io
  scope: Namespaced
  names:
    plural: canaryrollouts
    singular: canaryrollout
    kind: CanaryRollout
    shortNames: [clrollout]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [stableService, canaryService, ingressName]
              properties:
                serviceName: {type: string}
                stableService: {type: string}
                canaryService: {type: string}
                ingressName: {type: string}
                steps:
                  type: array
                  items: {type: integer, minimum: 1, maximum: 100}
                  default: [5, 25, 50, 100]
            status:
              type: object
              properties:
                phase: {type: string}
                trafficWeight: {type: integer}
                errorRate: {type: number}
                score: {type: number}
                stableLatencyMs: {type: number}
                canaryLatencyMs: {type: number}
                reason: {type: string}
                lastCheckedAt: {type: string}
