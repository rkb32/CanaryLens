apiVersion: apps/v1
kind: Deployment
metadata:
  name: canarylens-controller
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: {app: canarylens-controller}
  template:
    metadata:
      labels: {app: canarylens-controller}
    spec:
      serviceAccountName: canarylens-controller
      containers:
        - name: controller
          image: ghcr.io/YOUR_ACCOUNT/canarylens-controller:latest
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: MODE, value: kubernetes}
            - {name: NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: PORT, value: "8080"}
            - {name: CHECK_INTERVAL, value: 15s}
            - {name: ERROR_THRESHOLD, value: "0.01"}
            - {name: CORS_ORIGINS, value: https://canarylens.example.com}
            - name: API_TOKEN
              valueFrom: {secretKeyRef: {name: canarylens-api, key: token}}
            - {name: PROMETHEUS_URL, value: http://prometheus-operated.monitoring.svc:9090}
            - {name: SCORER_ADDR, value: canarylens-scorer.default.svc:50051}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: canarylens-db, key: url}}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 15}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: canarylens-controller
  namespace: default
spec:
  selector: {app: canarylens-controller}
  ports: [{name: http, port: 8080, targetPort: http}]
