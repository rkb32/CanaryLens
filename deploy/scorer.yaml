apiVersion: apps/v1
kind: Deployment
metadata:
  name: canarylens-scorer
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: {app: canarylens-scorer}
  template:
    metadata:
      labels: {app: canarylens-scorer}
    spec:
      containers:
        - name: scorer
          image: ghcr.io/YOUR_ACCOUNT/canarylens-scorer:latest
          imagePullPolicy: IfNotPresent
          ports: [{name: grpc, containerPort: 50051}]
          readinessProbe: {tcpSocket: {port: grpc}, initialDelaySeconds: 2, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata:
  name: canarylens-scorer
  namespace: default
spec:
  selector: {app: canarylens-scorer}
  ports: [{name: grpc, port: 50051, targetPort: grpc}]
