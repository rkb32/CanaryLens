apiVersion: apps/v1
kind: Deployment
metadata:
  name: canarylens-scorer
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: {app: canarylens-scorer}
  template:
    metadata:
      labels: {app: canarylens-scorer}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: scorer
          image: ghcr.io/YOUR_ACCOUNT/canarylens-scorer:latest
          imagePullPolicy: IfNotPresent
          ports: [{name: grpc, containerPort: 50051}]
          readinessProbe: {tcpSocket: {port: grpc}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: grpc}, initialDelaySeconds: 10, periodSeconds: 20}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: canarylens-scorer
  namespace: default
spec:
  selector: {app: canarylens-scorer}
  ports: [{name: grpc, port: 50051, targetPort: grpc}]
