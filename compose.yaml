services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: canarylens
      POSTGRES_PASSWORD: canarylens
      POSTGRES_DB: canarylens
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canarylens -d canarylens"]
      interval: 3s
      timeout: 3s
      retries: 20

  scorer:
    build: ./scorer
    ports: ["50051:50051"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',50051),2); s.close()"]
      interval: 2s
      timeout: 3s
      retries: 15

  controller:
    build: ./controller
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://canarylens:canarylens@postgres:5432/canarylens?sslmode=disable
      SCORER_ADDR: scorer:50051
      DEMO_MODE: "true"
      CORS_ORIGINS: http://localhost:3000
      CHECK_INTERVAL: ${CHECK_INTERVAL:-15s}
      ERROR_THRESHOLD: "0.01"
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      scorer: { condition: service_healthy }

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_URL: http://localhost:8080
    ports: ["3000:80"]
    depends_on: [controller]

volumes:
  pgdata:
